spring.application.name=PAYMENT-SERVICE
server.port=8084

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cravedash_payment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Simulated payment gateway: 0-100 percent success rate (default 100 => always succeeds)
payment.simulation.success-rate=${PAYMENT_SUCCESS_RATE:100}
